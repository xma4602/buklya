# ---------------------------------------------------------------------------
# Запуск:            docker compose up -d --build
# С PostgreSQL:      docker compose --profile postgres up -d --build
#                    (и в .env: DATABASE_URL=postgresql+asyncpg://buklya:buklya@postgres:5432/buklya)
# Логи контейнера:   docker compose logs -f bot
#
# Пути на хосте задаются переменными (по умолчанию — папка проекта):
#   ENV_FILE  — файл с переменными окружения   (по умолчанию ./.env)
#   DATA_DIR  — каталог для данных/БД          (по умолчанию ./data)
#   LOGS_DIR  — каталог для логов              (по умолчанию ./logs)
# providers.yaml копируется в образ при сборке; локально он дополнительно
# монтируется через docker-compose.override.yml, чтобы правки применялись без пересборки.
# ---------------------------------------------------------------------------
services:
  bot:
    build: .
    container_name: buklya-bot
    restart: unless-stopped
    env_file: ${ENV_FILE:-.env}
    environment:
      # Внутри контейнера пути фиксированы, они смонтированы как тома ниже
      LOG_DIR: /app/logs
      PROVIDERS_FILE: /app/providers.yaml
    volumes:
      - ${DATA_DIR:-./data}:/app/data
      - ${LOGS_DIR:-./logs}:/app/logs

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    container_name: buklya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: buklya
      POSTGRES_USER: buklya
      POSTGRES_PASSWORD: buklya
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: