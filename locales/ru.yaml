# Переопределения для ВКонтакте
# =============================================================================
vk:
  platform:
    name: ВКонтакте
  # Слова, которые можно написать вместо команды (через запятую).
  # Пока пользователь набирает письмо, работает только «отмена».
  aliases:
    start: начать, start
    help: помощь, help
    cancel: отмена, отменить
  common:
    unknown_message: Не понимаю 🦉 Воспользуйтесь кнопками меню или напишите /help.
  help:
    text: |-
      🦉 <b>Букля</b> — почтовая сова во {platform}.

      <b>Что я умею</b>
      • присылать новые письма из ваших ящиков (с указанием ящика и вложениями);
      • отвечать на письма прямо из чата — кнопка «↩️ Ответить» под письмом;
      • писать новые письма — «✉️ Написать»;
      • показывать последние письма — «📬 Последние письма», письмо открывается по нажатию на его номер.

      <b>Как написать ответ</b>
      Нажмите «Ответить» и отправляйте сообщения: текст (жирный, курсив,
      подчёркивание и ссылки сохранятся), фото, документы, голосовые. Письмо можно
      набирать <b>несколькими сообщениями</b> — всё соберётся в один черновик.
      Когда готово — «📤 Отправить».

      <b>Подключение ящика</b>
      «➕ Добавить ящик» → адрес → пароль. Для Яндекса, Gmail и Mail.ru нужен
      <b>пароль приложения</b> (бот подскажет, где его взять).
      Пароли хранятся только в зашифрованном виде. Сообщение с паролем лучше
      удалить из диалога — бот попробует сделать это сам.

      <b>Несколько мессенджеров</b>
      Букля работает в Telegram и во ВКонтакте. Свяжите их — и ящики станут общими:
      «🔗 Мессенджеры» → код → отправьте <code>/link КОД</code> боту в другом мессенджере.

      <b>Команды</b> (можно просто написать в чат)
      /add — подключить ящик
      /accounts — мои ящики
      /last — последние письма
      /compose — новое письмо
      /link — связать с другим мессенджером
      /cancel — отменить текущее действие
      /help — эта справка
  accounts:
    password_hint: |-
      🔑 Теперь отправьте пароль (или пароль приложения).
      <i>Я попробую сразу удалить сообщение с паролем; в базе он хранится только зашифрованным.</i>
    new_password: "🔑 Отправьте новый пароль. /cancel — отмена."
  inbox:
    page: |-
      📬 <b>{title}</b> — письма {first}–{last} из {total}
      🔵 — непрочитанные. Нажмите на номер письма, чтобы открыть.
  compose:
    video_unsupported: "⚠️ Видео из ВКонтакте нельзя приложить к письму — отправьте его файлом (документом)."
