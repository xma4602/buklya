# =============================================================================
# Букля — тексты бота (русский язык)
#
# Один файл на все платформы (Telegram и ВКонтакте).
#
# Как устроено:
#   * Ключи вложенные, в коде к ним обращаются через точку: t("accounts.added").
#   * {name} — подстановка значения из кода. Значения экранируются автоматически.
#   * Разметка — простой HTML: <b>, <i>, <u>, <code>, <pre>, <a href="...">.
#       Telegram показывает её как есть, ВКонтакте переводит в своё форматирование
#       (жирный, курсив, подчёркнутый, ссылки; <code> показывается обычным текстом).
#   * Символы < > & в самом тексте пишутся как &lt; &gt; &amp;
#   * Если текст для платформы должен отличаться — положите ключ с тем же
#     именем в секцию telegram: или vk: в конце файла. Например,
#     vk.accounts.password_hint переопределяет accounts.password_hint только для ВК.
#
# Новый язык: скопируйте файл в locales/<код>.yaml (например, en.yaml), переведите
# и задайте LOCALE=<код> в .env. Отсутствующие ключи берутся из ru.yaml.
# =============================================================================

platform:
  # Название платформы, подставляется в общие тексты
  name: мессенджере

# Названия платформ (в списке связанных мессенджеров)
platforms:
  telegram: Telegram
  vk: ВКонтакте

# ----------------------------------------------------------------------------- общее
common:
  friend: друг
  start: |-
    Привет, {name}! 🦉

    Я — Букля, буду приносить вашу почту прямо сюда.
  start_no_accounts: "Для начала подключите почтовый ящик: нажмите «➕ Добавить ящик» или /add."
  start_has_accounts: "Подключено ящиков: {count}. Новые письма придут автоматически."
  cancelled: Действие отменено.
  nothing_to_cancel: Отменять нечего 🙂
  unknown_message: Не понимаю 🦉 Воспользуйтесь кнопками меню или /help.
  stale_button: Эта кнопка больше не активна
  access_denied: ⛔ У вас нет доступа к этому боту.
  access_denied_short: ⛔ Нет доступа
  need_account: "Сначала подключите ящик: /add"
  account_not_found: Ящик не найден
  message_not_found: Письмо не найдено
  done: Готово 🦉
  no_subject: (без темы)
  error: "Ошибка: {error}"
  loading: Загружаю…

# ----------------------------------------------------------------------------- главное меню
menu:
  last: 📬 Последние письма
  compose: ✉️ Написать
  accounts: 📮 Мои ящики
  add: ➕ Добавить ящик
  link: 🔗 Мессенджеры
  help: ❓ Помощь

# Описания команд (меню команд Telegram)
commands:
  last: Последние письма
  compose: Написать письмо
  accounts: Мои ящики
  add: Подключить ящик
  link: Связать с другим мессенджером
  cancel: Отменить действие
  help: Справка

# ----------------------------------------------------------------------------- справка
help:
  text: |-
    🦉 <b>Букля</b> — почтовая сова в {platform}.

    <b>Что я умею</b>
    • присылать новые письма из ваших ящиков (с указанием ящика и вложениями);
    • отвечать на письма прямо из чата — кнопка «↩️ Ответить» под письмом;
    • писать новые письма — «✉️ Написать»;
    • показывать последние письма — «📬 Последние письма», письмо открывается по нажатию.

    <b>Как написать ответ</b>
    Нажмите «Ответить» и отправляйте сообщения: текст (жирный, курсив, ссылки,
    код, цитаты сохранятся), фото, документы, голосовые. Письмо можно набирать
    <b>несколькими сообщениями</b> — всё соберётся в один черновик.
    Когда готово — «📤 Отправить».

    <b>Подключение ящика</b>
    «➕ Добавить ящик» → адрес → пароль. Для Яндекса, Gmail и Mail.ru нужен
    <b>пароль приложения</b> (бот подскажет, где его взять).
    Пароли хранятся только в зашифрованном виде, а сообщение с паролем бот сразу удаляет.

    <b>Несколько мессенджеров</b>
    Букля работает в Telegram и во ВКонтакте. Свяжите их — и ящики станут общими:
    «🔗 Мессенджеры» → код → отправьте <code>/link КОД</code> боту в другом мессенджере.

    <b>Команды</b>
    /add — подключить ящик
    /accounts — мои ящики
    /last — последние письма
    /compose — новое письмо
    /link — связать с другим мессенджером
    /cancel — отменить текущее действие
    /help — эта справка

